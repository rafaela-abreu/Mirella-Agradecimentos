<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área da família · Mirella</title><link rel="stylesheet" href="/styles.css"></head><body><main class="admin-shell"><a class="back-link" href="/">← Voltar para agradecimentos</a><section class="admin-card"><span class="eyebrow">álbum da família</span><h1>Adicionar fotinhas</h1><p class="admin-lead">Escolha uma ou várias fotos da festa. Depois do envio, elas entram na galeria pública para os convidados salvarem.</p><div id="loggedOut" class="login-box"><p>Para cuidar do álbum, entre com sua conta autorizada.</p><a class="primary-button" href="/auth/login">Entrar como responsável</a></div><div id="loggedIn" hidden><div class="upload-drop"><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><label for="photoInput"><span>＋</span><strong>Escolher fotos</strong><small>Você pode selecionar uma ou várias de uma vez</small></label></div><div id="selectedList" class="selected-list"></div><button id="uploadButton" class="primary-button" disabled>Publicar fotos</button><p id="uploadStatus" class="status" role="status"></p><h2>Fotos publicadas</h2><div id="adminGallery" class="admin-gallery"></div><form action="/auth/logout" method="post"><button class="text-button" type="submit">Sair</button></form></div></section></main><script src="/familia.js"></script></body></html>
